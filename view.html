<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wander walkthrough</title>
<style>
  :root{--line:#23252a;--muted:#8a8f98}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#08090a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",sans-serif;letter-spacing:-.01em;overflow:hidden}
  #stage{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,18,.55);cursor:pointer;backdrop-filter:blur(2px)}
  #overlay .card{text-align:center;padding:26px 34px;border-radius:16px;background:rgba(8,9,10,.85);border:1px solid var(--line)}
  #overlay h2{margin:0 0 4px;font-size:22px} #overlay p{margin:0;color:var(--muted);font-size:14px} #overlay .t{margin-top:10px;font-size:12px;color:var(--muted)}
  #top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(rgba(10,12,18,.75),transparent);pointer-events:none}
  #top *{pointer-events:auto}
  .logo{font-weight:700;font-size:16px;text-decoration:none;color:#fff} .logo span{color:#fff}
  #title{font-size:14px;color:#dfe3ec} #title small{color:var(--muted);margin-left:8px}
  #rooms{position:absolute;right:14px;top:56px;bottom:84px;width:132px;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:auto;background:rgba(8,9,10,.6);border:1px solid rgba(255,255,255,.1);border-radius:16px;backdrop-filter:blur(10px);scrollbar-width:none}
  #rooms::-webkit-scrollbar{display:none}
  #rooms button{position:relative;flex:0 0 auto;height:72px;border-radius:11px;border:2px solid transparent;background:#1b1e26 center/cover no-repeat;color:#fff;font-size:12px;font-weight:500;cursor:pointer;text-align:left;padding:0;overflow:hidden;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #rooms button span{position:absolute;left:8px;bottom:6px;right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #rooms button::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.6))}
  #rooms button:hover{border-color:rgba(255,255,255,.45)} #rooms button.on{border-color:#ffffff}
  #bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:rgba(8,9,10,.75);border:1px solid rgba(255,255,255,.12);border-radius:999px;backdrop-filter:blur(10px)}
  #bar button{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center} #bar button:hover,#bar button.on{background:rgba(255,255,255,.12)} #bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #tip{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font-size:11px;color:var(--muted);letter-spacing:.04em;pointer-events:none}
  #stick{position:absolute;right:22px;bottom:22px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:none;touch-action:none}
  #stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
  @media(pointer:coarse){#stick{display:block}}
  #brand{position:absolute;right:16px;top:14px;font-size:11px;color:var(--muted);letter-spacing:1px}
  #map{position:absolute;left:14px;bottom:18px;width:170px;background:rgba(8,9,10,.75);border:1px solid var(--line);border-radius:12px;padding:8px;backdrop-filter:blur(6px)} #map canvas{width:100%;display:block;border-radius:6px} #map small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  #hud{display:none;position:absolute;right:16px;bottom:16px;font-size:12px;color:#dfe3ec;background:rgba(8,9,10,.75);border:1px solid var(--line);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)} #hud b{color:#fff}
  @media(max-width:640px){#map{width:110px;bottom:78px}#rooms{display:none}#stick{right:14px;bottom:78px}}
  #load{position:absolute;inset:0;display:grid;place-items:center;background:#08090a;color:var(--muted);font-size:14px;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="top"><a class="logo" href="./"><span>W</span>ander</a><div id="title"></div></div>
  <div id="brand">WALKTHROUGH</div>
  <div id="rooms"></div>
  <div id="map"><small>You are here</small><canvas id="mapc" width="300" height="200"></canvas></div>
  <div id="hud"><b>W A S D</b> move · drag / mouse look · <b>Shift</b> run</div>
  <div id="tip">W A S D to move · drag to look · Shift to run</div>
  <div id="bar">
    <button id="bPrev" title="Previous room"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="bDoll" title="Dollhouse view"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg></button>
    <button id="bNext" title="Next room"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="bFull" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="stick"><i></i></div>
  <div id="overlay"><div class="card"><h2>Click to walk in</h2><p>W A S D to move · mouse to look · Shift to run · Esc to release</p><div class="t">On a phone, drag to look and use the joystick to move</div></div></div>
  <div id="load">Building the house…</div>
</div>
<script type="module">
import { createViewer, texturesReady } from './lib/wander-engine.js?v=0671f98';
const q = new URLSearchParams(location.search);
const src = q.get('p') ? `projects/${q.get('p')}.json` : null;
const overlay = document.getElementById('overlay');
const v = createViewer(document.getElementById('c'), overlay);
let project;
if (src) project = await (await fetch(src)).json();
else if (q.get('data')) project = JSON.parse(decodeURIComponent(atob(q.get('data'))));
else { document.getElementById('load').textContent = 'No walkthrough specified.'; throw 0; }
document.getElementById('title').innerHTML = `${project.title||'Walkthrough'}<small>${project.rooms.length} rooms</small>`;
// image size is needed for scale; load the plan image (or use stored dims)
let iw = project.iw, ih = project.ih;
if (!iw) { const im = new Image(); im.src = project.planUrl || project.plan; await new Promise(r => im.onload = r); iw = im.width; ih = im.height; }
const built = await v.load(project.rooms, { startRoom: +(q.get('room')||0), H: +project.wallH || 2.6, mpp: (+project.scale)/iw, iw, ih, quality: q.get('embed') ? 'lite' : 'full' });
const rb = document.getElementById('rooms'); const roomBtns = project.rooms.map((r,i) => { const b=document.createElement('button'); b.innerHTML=`<span>${r.name}</span>`; b.onclick=()=>goRoom(i); rb.appendChild(b); return b; });
let curRoom = +(q.get('room')||0);
function goRoom(i, instant){ curRoom=(i+project.rooms.length)%project.rooms.length; instant ? v.teleport(curRoom) : v.glideTo(curRoom); document.getElementById('bDoll').classList.remove('on'); }
addEventListener('message',e=>{ if(e.data&&typeof e.data.teleport==='number'){ goRoom(e.data.teleport); } if(e.data&&e.data.dollhouse!==undefined){ toggleDoll(e.data.dollhouse==='toggle'?undefined:e.data.dollhouse); } });
function toggleDoll(on){ const d=v.dollhouse(on); document.getElementById('bDoll').classList.toggle('on',d); }
document.getElementById('bPrev').onclick=()=>goRoom(curRoom-1);
document.getElementById('bNext').onclick=()=>goRoom(curRoom+1);
document.getElementById('bDoll').onclick=()=>toggleDoll();
document.getElementById('bFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };
// room thumbnails: quick offscreen snapshots from each room centre after first paint
if (!q.get('still')) setTimeout(()=>{ const savedP=v.camera.position.clone(), savedR=v.camera.rotation.clone(); project.rooms.forEach((r,i)=>{ v.teleport(i); roomBtns[i].style.backgroundImage=`url(${v.thumb()})`; }); v.camera.position.copy(savedP); v.camera.rotation.copy(savedR); }, 400);
document.getElementById('load').remove();
// mini-map: rooms drawn to scale, camera dot + heading
{ const mc=document.getElementById('mapc'), g=mc.getContext('2d'); const rw=project.rooms.map(r=>r.pts.map(p=>({x:p.x*iw*(+project.scale/iw), z:p.y*ih*(+project.scale/iw)})));
  const xs=rw.flat().map(p=>p.x), zs=rw.flat().map(p=>p.z); const mnx=Math.min(...xs), mxx=Math.max(...xs), mnz=Math.min(...zs), mxz=Math.max(...zs); const pad=10; const s=Math.min((mc.width-2*pad)/(mxx-mnx),(mc.height-2*pad)/(mxz-mnz)); const ox=(mc.width-(mxx-mnx)*s)/2, oz=(mc.height-(mxz-mnz)*s)/2;
  const X=x=>ox+(x-mnx)*s, Z=z=>oz+(z-mnz)*s; let cur=-1;
  const inPoly=(p,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.z>p.z)!==(b.z>p.z))&&(p.x<(b.x-a.x)*(p.z-a.z)/(b.z-a.z)+a.x))c=!c;}return c;};
  const draw=()=>{ requestAnimationFrame(draw); g.clearRect(0,0,mc.width,mc.height); const cp={x:v.camera.position.x,z:v.camera.position.z}; cur=rw.findIndex(r=>inPoly(cp,r));
    rw.forEach((r,i)=>{ g.beginPath(); r.forEach((p,j)=>j?g.lineTo(X(p.x),Z(p.z)):g.moveTo(X(p.x),Z(p.z))); g.closePath(); g.fillStyle=i===cur?'rgba(255,255,255,.55)':'rgba(255,255,255,.14)'; g.fill(); g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=1.5; g.stroke(); });
    const yaw=v.camera.rotation.y; const dx=-Math.sin(yaw), dz=-Math.cos(yaw); g.fillStyle='rgba(255,209,102,.35)'; g.beginPath(); g.moveTo(X(cp.x),Z(cp.z)); g.arc(X(cp.x),Z(cp.z),34,Math.atan2(dz,dx)-0.5,Math.atan2(dz,dx)+0.5); g.closePath(); g.fill();
    g.fillStyle='#ffd166'; g.beginPath(); g.arc(X(cp.x),Z(cp.z),5,0,7); g.fill(); g.strokeStyle='#1c1a17'; g.lineWidth=1.5; g.stroke();
    const tl=document.getElementById('title'); if(cur>=0){ tl.innerHTML=`${project.title||'Walkthrough'}<small>${project.rooms[cur].name}</small>`; roomBtns.forEach((b,i)=>b.classList.toggle('on',i===cur)); } };
  draw(); }
if (q.get('view')==='dollhouse') { toggleDoll(true); }
if (q.get('still')) { await texturesReady(); await new Promise(r=>setTimeout(r,300)); v.pause(true); const img=document.createElement('img'); img.id='still'; img.src=v.screenshot(); document.body.appendChild(img); }
if (q.get('embed')) overlay.querySelector('h2').textContent = 'Click to walk in';
// touch joystick
const st=document.getElementById('stick'), knob=st.querySelector('i'); let sid=null;
st.addEventListener('pointerdown',e=>{sid=e.pointerId; st.setPointerCapture(sid);}); st.addEventListener('pointerup',()=>{sid=null; v.touch.move={x:0,y:0}; knob.style.left='35px'; knob.style.top='35px';});
st.addEventListener('pointermove',e=>{ if(e.pointerId!==sid) return; const r=st.getBoundingClientRect(); let x=(e.clientX-r.left-55)/45, y=(e.clientY-r.top-55)/45; const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} v.touch.move={x,y}; knob.style.left=35+x*35+'px'; knob.style.top=35+y*35+'px'; });
</script>
</body>
</html>
